name: IndexNow
# Manual IndexNow ping for specific paths. After each production deploy, the
# indexnow job in deploy.yml pings the changed URLs automatically.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Space separated paths to ping, e.g. "/ /sitemap"'
        required: true
      dry_run:
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ping IndexNow
        env:
          PATHS: ${{ inputs.paths }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          read -r -a paths <<< "$PATHS"
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/indexnow.mjs "${args[@]}" -- "${paths[@]}"
